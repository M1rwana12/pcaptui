name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads the tag history for the changelog
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      # The version is compiled in, not injected, so a tag that disagrees with
      # version.go would ship binaries reporting the wrong number. Releases
      # cannot be quietly replaced once people have them.
      - name: Tag must match version.go
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          compiled=$(grep -oP 'Version string = "\K[^"]+' version.go)
          echo "tag=$tag  version.go=$compiled"
          if [ "$tag" != "$compiled" ]; then
            echo "::error::tag $tag does not match version.go ($compiled)"
            exit 1
          fi

      - name: Install tshark
        run: |
          # Best effort: the runner image carries third-party lists we do not
          # need - Google Chrome's among them - and one of those serving a bad
          # index made apt-get exit non-zero and, under `bash -e`, killed this
          # step before the install ran. apt itself said "ignored, or old ones
          # used instead". The install below is the real gate: if the archive
          # tshark comes from is genuinely unreachable, it fails there and says
          # so.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq || echo "apt-get update reported errors; continuing to the install"
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark

      # Releasing something whose tests were never run is how a broken binary
      # reaches people who then have no reason to trust the next one. The
      # variable is what makes that true: the thirty-one tests that drive a
      # real tshark skip themselves when there is none, and this is the last
      # run where a silent skip would matter.
      - name: Test
        run: go test ./...
        env:
          PCAPTUI_REQUIRE_TSHARK: 1

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
