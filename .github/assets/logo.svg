<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="pcaptui">
  <title>pcaptui</title>

  <!-- Terminal card. Dark on purpose: it reads the same on GitHub's light and
       dark themes, and the subject is a terminal. -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0D1117"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#21262D" stroke-width="16"/>

  <!-- Gutter: the packet numbers column of the list view. -->
  <g fill="#30363D">
    <rect x="104" y="150" width="26" height="18" rx="9"/>
    <rect x="104" y="212" width="26" height="18" rx="9"/>
    <rect x="104" y="274" width="26" height="18" rx="9"/>
    <rect x="104" y="336" width="26" height="18" rx="9"/>
  </g>

  <!-- Packet rows. The selected one is the whole idea of the tool: you are
       looking at one packet out of many. -->
  <rect x="152" y="146" width="196" height="26" rx="13" fill="#30363D"/>
  <rect x="152" y="208" width="256" height="26" rx="13" fill="#F0883E"/>
  <rect x="152" y="270" width="164" height="26" rx="13" fill="#30363D"/>
  <rect x="152" y="332" width="222" height="26" rx="13" fill="#30363D"/>

  <!-- The detail line under the selection: the protocol tree opening up. -->
  <g fill="#8B949E">
    <rect x="176" y="240" width="10" height="10" rx="5"/>
    <rect x="196" y="242" width="88" height="6" rx="3"/>
  </g>
</svg>
